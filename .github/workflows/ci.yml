
name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DOCKER_IMAGE_NAME: syrinekhattat1234/democyber:latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Scan for leaked secrets
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      # 3. Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 4. Build Java project
      - name: Build Java project with Maven
        run: mvn --batch-mode clean package

      # 5. Configure Docker Buildx
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # 6. Build Docker image
      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t "$DOCKER_IMAGE_NAME" .

      # 7. Test Docker image
      - name: Test Docker image locally
        if: github.event_name == 'push'
        run: |
          docker run -d --name democyber-test -p 8080:8081 "$DOCKER_IMAGE_NAME"
          sleep 10
          curl -f http://localhost:8080/
          docker stop democyber-test
          docker rm democyber-test

      # 8. Scan Docker image with Trivy
      - name: Scan Docker image with Trivy
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # 9. Upload Trivy report
      - name: Upload Trivy report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: ignore

      # 10. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Push Docker image
      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push "$DOCKER_IMAGE_NAME"

      # 12. Upload Gitleaks report
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

      # Push Docker image sur Docker Hub
      - name: Push Docker image
        run: docker push $DOCKER_IMAGE_NAME

