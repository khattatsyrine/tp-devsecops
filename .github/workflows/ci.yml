
name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Scan for leaked secrets
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      # 3. Upload Gitleaks report
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

      # 4. Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 5. Build Java project
      - name: Build Java project with Maven
        run: mvn --batch-mode clean package

      # 6. Build Docker image
      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t "$DOCKER_IMAGE_NAME" .

      # 7. Test Docker image
      - name: Test Docker image
        if: github.event_name == 'push'
        run: |
          docker run -d --name democyber-test -p 8082:8081 "$DOCKER_IMAGE_NAME"
          sleep 10
          curl --fail http://localhost:8082/
          docker rm -f democyber-test

      
      # 8. Generate Trivy SARIF report
      - name: Generate Trivy report
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'sarif'
          output: '${{ github.workspace }}/trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 9. Upload Trivy report
      - name: Upload Trivy report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn

      # 10. Fail if HIGH or CRITICAL vulnerabilities are found
      - name: Check Trivy vulnerabilities
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

